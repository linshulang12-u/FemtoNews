# Thumbnails
#   oa_figure_else_cover : open-access paper -> its own preview image (og:image, usually Fig. 1 or the
#                          graphical abstract); paywalled paper -> journal cover only. (default)
#   all                  : every paper -> its preview image; journal cover as fallback
# If nothing is found the site draws a process glyph (see `glyphs`).
figures:
  mode: oa_figure_else_cover
  max_width: 400
  max_height: 280
  min_side_px: 120         # smaller images are treated as logos and ignored
  reject_url_patterns: ['logo', 'favicon', 'default', 'placeholder', 'sprite', 'icon', 'blank']

# Journal covers, used when an article page offers no preview image.
# Key = journal title (case-insensitive) or ISSN; value = an image URL you are allowed to use.
journal_covers: {}

# Category rules. A category is added when any of its patterns matches title or abstract.
# Group names and their order must match the site's GROUPS (index.html).
categories:
  Directions:
    Quantum Photonics & Color Centers: ['quantum (photonic|circuit|emitter|sensing|walk|gate|information|memor\w*|interference|state|optic|light|key|simulat\w*|processor|comput\w*|network|repeater|frequency conversion)', 'colou?r cent', '\bNV\b', 'nitrogen-vacancy', 'single[- ]photons?', 'photon pairs?', 'entangl', 'qubit', 'qudit', 'spin defect', 'magnetometr', 'boson sampling', 'Hong[- ]Ou[- ]Mandel', 'squeez\w* (light|state|vacuum)', '(ion|atom) traps?', 'trapped[- ](ion|atom)', 'Paul (trap|wheel)', 'atom chips?', 'Bell states?', 'universal photonic processor']
    Hard & Brittle Materials: ['(sapphire|silicon carbide|\bSiC\b|4H-SiC|diamond|glass|fused silica|ceramics?|\bGaN\b|Ga2O3|quartz|brittle|wafers?)\W+(\w+\W+){0,5}\b(cut|drill|dic|slic|thin|machin|ablat|groov|holes?\b|vias?\b|scrib|polish|separat|crack)', '\b(cut|drill|dic|slic|thin|machin|ablat|groov|scrib|polish|separat|process)\w*\W+(\w+\W+){0,5}(sapphire|silicon carbide|\bSiC\b|4H-SiC|diamond|glass|fused silica|ceramics?|\bGaN\b|wafers?)', 'stealth dicing|laser slicing|through[- ]glass vias?|\bTGVs?\b|hard[- ](and[- ])?brittle']
    Waveguides & Photonic Chips: ['waveguide', 'photonic (chip|circuit|lattice|integrated)', 'integrated photonic', 'directional coupler', 'Y-junction', 'Bloch oscillation', 'photonic lantern', 'optical hybrid', 'power splitter']
    Two-Photon Polymerization: ['two-photon (induced )?(polymeri|lithograph|direct laser writing|3D print|reduction)', 'multi-?photon (lithograph|polymeri|fabricat|3D print)', '\b2PP\b', '3D nano-?print', 'nanoprint', 'photoresists?', 'volumetric (additive|printing)']
    Optical Computing: ['optical comput', 'photonic comput', 'diffractive (deep )?neural', '\bD2NN\b', 'neuromorphic', 'optical neural', 'matrix[- ]vector', 'in-sensor comput', 'optical (logic|processor)', 'image processing']
    Optical Data Storage: ['data storage', 'optical storage', 'optical memory', '\b5D\b', 'nanogratings?', 'birefringent (modification|nanostructur)', 'anti-?counterfeit', 'information (encryption|storage)']
    Surface Structuring & LIPSS: ['\bLIPSS\b', 'periodic surface structur', 'ripples?\b', 'surface textur', 'superhydrophob', 'hydrophilic', 'wettability', 'anti-?icing', 'anti-?reflect', 'black (silicon|metal)', 'structural colou?r', 'hierarchical (micro|structur)', 'biomimetic', 'bioinspired', 'shark-?skin', 'surface (morpholog|modification|structuring|oxidation)', 'micro-?structuring']
    Fiber Gratings & Devices: ['fib(er|re) Bragg', '\bFBGs?\b', 'long[- ]period (fib(er|re) )?grating', '\bLPFGs?\b', 'in-?fib(er|re)', 'fib(er|re)[- ](tip|end|facet|probe)', 'lab[- ]on[- ]fib', 'hollow[- ]core fib']
