# FemtoNews — scraper configuration (ultrafast laser fabrication)
# Adapted from VibraNews (ForestBin-Raman). Edit this file to change what the daily crawl looks for.

site:
  name: FemtoNews
  url: https://linshulang12-u.github.io/FemtoNews/   # used in the bot User-Agent

# Polite crawling
http:
  user_agent: "FemtoNewsBot/1.0 (+{site_url}; weekly literature digest)"
  timeout_s: 20
  delay_s: 1.0            # pause between requests to the same publisher site
  api_delay_s: 0.2        # pause between requests to the open APIs (OpenAlex, Crossref, Europe PMC, arXiv)
  respect_robots_txt: true

# Search sources (all free, no API key needed)
sources:
  europepmc: true          # PubMed / PMC / preprints (biomedical fs-laser work, ophthalmology, cryo-ET)
  openalex: true           # every journal, with abstracts and institutions (main source for this field)
  crossref: true           # Optica / Elsevier / IOP / AIP journals not in PubMed
  arxiv: true              # physics.optics, physics.app-ph, cond-mat.mtrl-sci, quant-ph preprints
  max_results_per_query: 400    # arXiv
  max_europepmc: 6000           # records per run
  max_crossref_rows: 1000       # per query (Crossref maximum)
  max_openalex_per_term: 6000   # per search term

# A paper is kept if its TITLE matches any include pattern,
# or its ABSTRACT matches one at least twice. Patterns are case-insensitive regular expressions.
include:
  - '\b(femto|pico)-?second[- ](pulsed?[- ])?laser[- ]?(direct[- ])?(writ|inscri|fabricat|process|machin|micromachin|ablat|structur|nanostructur|textur|drill|cut|dic|slic|thin|weld|join|modif|induc|irradiat|pattern|print|engrav|mark|trim|polish|clean|strip|reduc|crystalli|sinter|etch|lithograph|assisted|based|treat)'
  - '\bultra-?(fast|short)[- ](pulsed?[- ])?(pulse[sd]?[- ])?laser[- ]?(direct[- ])?(writ|inscri|fabricat|process|machin|micromachin|ablat|structur|nanostructur|textur|drill|cut|dic|slic|thin|weld|join|modif|induc|irradiat|pattern|print|engrav|mark|trim|polish|clean|etch|lithograph)'
  - '\b(fs|ps)[- ]laser'
  - '(direct )?laser[- ](direct[- ])?writ(e|ten|ing)|laser-inscribed'
  - 'two-photon (polymeri|lithograph|direct laser writing|3D print|nanoprint|fabricat|reduction)|multi-?photon (lithograph|polymeri|fabricat|3D print|reduction)|\b2PP\b|3D nano-?print|nano-?3D print|volumetric (additive manufacturing|3D printing)'
  - 'laser-induced periodic surface|\bLIPSS\b'
  - 'laser-induced (graphene|forward transfer|nanostructur|crystalli|selective etching|microstructur|surface structur)'
  - 'selective (laser-induced |laser )?etching|laser-assisted (chemical |wet )?etching|\bFLI?CE\b|\bFLISE\b'
  - 'nano-?gratings? in (glass|silica|fused silica)|self-organi[sz]ed nano-?gratings?|5D (optical )?(data )?(storage|memory)|optical data storage|glass (data )?storage|laser-written (data|memory|storage)'
  - 'stealth dicing|laser (dicing|slicing|lift-?off|scribing|trimming)\b'
  - '(GHz|MHz)[- ]burst|burst[- ]mode (ablation|processing|laser|femtosecond|ultrashort)'
  - 'Bessel[- ]beams?\W+(\w+\W+){0,6}(cut|drill|dic|machin|process|fabricat|writ|ablat|weld|hole|via)'
  - 'spatio-?temporal(ly)? focus|\bSSTF\b|simultaneous spatial and temporal focus'
  - 'laser ablation in (liquids?|water)|pulsed laser ablation in liquid|\bPLAL\b|laser fragmentation in liquid'
  - 'laser (micro|nano)-?(machining|fabrication|structuring|processing|printing|welding|texturing|drilling|cutting|patterning|lithography|surgery|ablation)'
  - 'ultrafast laser|ultrashort[- ]pulse(d)? laser|femtosecond[- ]laser|picosecond[- ]laser'

# Process names specific enough that ONE mention in the abstract is enough
strong_include:
  - 'femtosecond[- ]laser[- ](direct[- ])?writ'
  - '(femtosecond|ultrafast|fs)[- ]laser[- ](written|inscribed)'
  - 'laser[- ]written (waveguide|circuit|chip|photonic|grating|structure)'
  - 'two-photon polymeri[sz]ation|multiphoton lithograph|two-photon lithograph'
  - 'laser-induced periodic surface structures'
  - 'selective laser-induced etching|femtosecond[- ]laser[- ]induced (selective )?(chemical )?etching'
  - '5D optical (data )?storage'
  - 'ultrafast laser (weld|writ|inscri|micromachin|nanostructur|process)'
  - '(femto|pico)second[- ]laser (micro|nano)?-?(machin|fabricat|ablat|process|structur|textur|inscri|drill|cut|weld|modif|irradiat|pattern|print)'
  - 'stealth dicing'
  - '\blaser[- ](written|inscribed|micromachined)\b|ultrafast laser inscription|femtosecond laser micromachining|selective laser etching'
  - 'laser (writing|written|annealing|activation) of (single )?(colou?r cent|NV|nitrogen-vacancy|vacanc|spin defect|quantum emitter)'
  - '(GHz|MHz)[- ]burst'
  - 'spatiotemporal focusing'

# Generic terms count only in the TITLE: in abstracts they are mostly incidental
title_only:
  - 'ultrafast laser'
  - 'femtosecond[- ]laser'
  - 'picosecond[- ]laser'
  - 'ultrashort[- ]pulse(d)? laser'

# Mentions inside characterisation lists ("SEM, XRD, Raman and XPS") are not counted
characterisation_list: '(?:\b(?:XRD|XPS|SEM|TEM|HRTEM|EDS|EDX|BET|TGA|DSC|UV-?vis(?:ible)?|NMR|FT-?IR|Raman|PL|AFM|EBSD|EPR|XAS|DLS)\b(?:\s*(?:spectroscopy|spectra|analysis|analyses|measurements?))?\s*(?:,|/|;|\band\b|\bor\b)\s*){2,}(?:\band\s+)?\b(?:XRD|XPS|SEM|TEM|HRTEM|EDS|EDX|BET|TGA|DSC|UV-?vis(?:ible)?|NMR|FT-?IR|Raman|PL|AFM|EBSD|EPR|XAS|DLS)\b'

# Records from data repositories are not articles
exclude_sources: ['zenodo', 'figshare', 'mendeley data', 'dryad', 'harvard dataverse', 'pangaea']

# Further topics. A paper is included when its TITLE matches a `title` pattern, or its ABSTRACT mentions
# one `abstract` term once, unless one of the topic's `exclude` patterns applies.
extra_topics:
  - name: Laser-written photonics
    title:
      - '(waveguide|photonic lattice|photonic chip|integrated photonic)s?\b.*\b(femtosecond|ultrafast|laser[- ]written|direct[- ]writ)'
      - 'photonic lanterns?\b.*\blaser'
      - 'fib(er|re) Bragg gratings?\b.*\b(femtosecond|ultrafast|point-by-point|plane-by-plane|line-by-line)'
    abstract:
      - 'femtosecond[- ]laser[- ]written waveguides?'
      - 'point-by-point (inscription|writing)'
      - 'plane-by-plane (inscription|writing)'
  - name: Light-field engineering for processing
    title:
      - '(spatial light modulator|hologra\w*|multi-?foc\w*|parallel)\b.*\b(fabricat|process|machin|writ|printing|ablat)'
      - '(fabricat|process|machin|writ|printing|ablat)\w*\b.*\b(spatial light modulator|hologra\w*|multi-?foc\w*|Bessel|Airy|vortex beam|flat-?top|top-?hat)'
    abstract:
      - 'holographic (femtosecond|laser) (fabrication|processing|printing|writing)'
      - 'multifocal (femtosecond|laser) (fabrication|processing|writing)'
    exclude: ['microscop', 'optical trapping|optical tweezers']

# Core journals: EVERY paper they publish is included (no keyword filter)
core_journals:
  issn: ['1880-0688']
  titles: ['journal of laser micro/nanoengineering', 'journal of laser micro nanoengineering']

# Papers first published longer ago than this are ignored (re-indexed old papers, late corrections)
max_age_days: 180

# Drop a paper if its title or abstract matches any of these
exclude:
  - 'LA-?ICP-?MS|laser ablation[- ]inductively coupled|inductively coupled plasma[- ]mass'   # geochemistry / elemental analysis
  - 'laser-induced breakdown spectroscop|\bLIBS\b'                                          # analytical spectroscopy
  - 'endovenous|thyroid nodul|radiofrequency ablation|catheter ablation|atrial fibrillation|interstitial laser|varicose|pilonidal|benign prostatic'
  - 'attosecond|high[- ]harmonic generation|wakefield|laser[- ]plasma accelerat|(electron|proton|ion) accelerat|inertial confinement|relativistic (laser|intensit|plasma)|petawatt'
  - '\b(fNIRS|lidar)\b|light detection and ranging'
  - 'two-photon (excitation|microscop|fluorescence (imaging|microscop)|calcium imaging|absorption cross)'
  - 'free-electron laser|x-ray free-electron|\bXFEL\b'
  - '\b(galax(y|ies)|exoplanet|interstellar)\b'

# Technique / process / method papers MUST be included: a paper that uses one of `terms` AND matches one
# of `cues` bypasses the routine-application, title and soft exclusions and the venue h-index check, needs
# only one mention, and is put on the front page ("Selected Papers") automatically.
technique:
  terms:
    - '(femto|pico)-?second[- ](pulsed?[- ])?laser|ultra-?(fast|short)[- ](pulsed?[- ])?(pulse[sd]?[- ])?laser|\bfs[- ]laser|two-photon polymeri|multi-?photon lithograph|laser[- ]written|direct laser writing|laser direct writing'
  # broad cues: protect the paper from every exclusion (it is never dropped)
  cues:
    - '\b(we|here,? we|this work|this paper)\s+(\w+\s+){0,3}(develop|demonstrat|present|introduc|report|propos|realiz|build|construct|design|invent)\w*\s+(\S+\s+){0,8}?(writ\w*|fabricat\w*|print\w*|lithograph\w*|machin\w*|process\w*|method|strategy|technique|approach|platform|route|scheme)'
    - '(writ|inscri|fabricat|machin|ablat|structur|weld|drill|cut|dic|slic|etch|print|polymeri)\w*\b.*\b(waveguide|photonic (chip|circuit|lattice)|fib(er|re) Bragg|metasurface|microlens|micro-?optic|nanograting|data storage|microfluidic|quantum|color cent|sapphire|silicon carbide|diamond|fused silica|glass)'
  # strict cues: the paper also goes straight to the front page ("Selected Papers")
  strong_cues:
    - '\b(we|here,? we|this work)\s+(\w+\s+){0,2}(develop|demonstrat|present|introduc|report|propos|realiz|invent)\w*\s+(a|an|the first)\s+(\S+\s+){0,6}?(method|technique|strategy|approach|platform|printer|system|scheme|route|process|paradigm)\b'
    - '\b(first|record|unprecedented|orders? of magnitude|sub-?10 ?nm|sub-?diffraction|super-?resolution|nanometer[- ]scale|3D (photonic|integrated))\b'
  journals: ['^optica\b', 'optics express', 'optics letters', 'light: science', 'light: advanced manufacturing', 'nature photonics', 'nature communications', 'science advances', 'advanced photonics', 'apl photonics', '^elight', 'photonix', 'laser & photonics', 'opto-electronic advances', 'international journal of extreme manufacturing', 'advanced materials', 'nano letters', 'acs photonics', 'ultrafast science', 'optics & laser technology', 'optics and lasers in engineering', 'applied surface science', 'journal of materials processing technology', 'international journal of machine tools', 'cirp annals', 'journal of laser applications', 'applied physics a', 'optical materials express', 'nanophotonics', 'photonics research', 'chinese optics letters', 'chinese journal of lasers', 'journal of physics d', 'additive manufacturing']

# Routine applications: the TITLE names a clinical-outcome setting AND a standard fs-laser surgical procedure.
# Technique papers on the laser process itself are unaffected.
routine_application:
  domain:
    - 'outcomes?|follow-?up|retrospective|prospective|randomi[sz]ed|comparative study|patients?|eyes\b|case series|cohort|visual acuity|complications'
  method:
    - 'femtosecond laser[- ]assisted (cataract|keratoplasty|LASIK|surgery)|\bFLACS\b|\bLASIK\b|\bSMILE\b|small[- ]incision lenticule|keratomileusis|phacoemulsification'

# Title-only exclusions: off-topic hits, editorial matter
exclude_title:
  - '^comment on\b|^reply to\b|^erratum|^correction'
  - 'call for papers|editorial board|issue information'
  - 'laser hair|tattoo removal|photodynamic therapy|low-level laser|photobiomodulation'
  - 'selective laser melting|powder bed fusion|\bL-?PBF\b|laser cladding|directed energy deposition|laser metal deposition|wire[- ]arc|laser-arc hybrid'

# Off-topic uses of ultrafast lasers (spectroscopy, laser physics, magnetism) are dropped unless the title
# names a fabrication term
soft_exclude:
  patterns:
    - 'ultrafast (magnet|demagnet|spin|carrier|exciton|charge|electron dynamics)|coherent phonon|transient absorption|photoemission|time-resolved spectroscop|pump-probe spectroscop|exciton-polariton|nonadiabatic|photodissociation|photoisomeri'
    - 'mode-?locked (fib(er|re) )?laser|soliton|dissipative|supercontinuum|frequency comb|optical parametric|pulse compression|chirped[- ]pulse amplification|regenerative amplifier'
    - 'filament(ation)? in air|air filament|terahertz (generation|emission)|microwave radiation'
  unless_title: ['writ', 'inscri', 'fabricat', 'machin', 'ablat', 'process', 'structur', 'textur', 'weld', 'drill', 'cut', 'modif', 'polymeri', 'printing', 'lithograph', 'etch', 'micromachin', 'nanostructur', 'pattern', 'dicing', 'trimm']

# Venue filter: papers from these DOI prefixes (publishers / preprint servers) are kept; papers from
